server:
  port: ${PORT:8080}

spring:
  application:
    name: docify-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

docify:
  ai:
    api-key: ${AI_API_KEY:change-me}
    model: ${AI_MODEL:gemini-2.5-flash-lite}
    base-url: ${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    fallback-models: ${AI_FALLBACK_MODELS:gemini-2.5-flash,gemini-flash-latest,gemini-2.5-pro}

  rate-limit:
    requests-per-day: ${RATE_LIMIT_PER_DAY:20}

