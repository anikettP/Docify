<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Docify Popup</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        width: 420px;
        min-height: 520px;
        border-radius: 32px;
        overflow: hidden;
        /* Light lavender ambient — makes container curved edges crisp */
        background: linear-gradient(145deg,
          #ede9fe 0%,
          #f5f3ff 25%,
          #ffffff 55%,
          #f0f4ff 80%,
          #ede9fe 100%
        );
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup/main.tsx"></script>
  </body>
</html>
