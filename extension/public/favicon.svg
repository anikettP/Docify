<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(99,60,220,0.45)"/>
    </filter>
  </defs>
  <!-- Background rounded square — matching floating badge gradient -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Inner highlight -->
  <rect width="128" height="128" rx="28" fill="url(#highlight)" opacity="0.12"/>
  <!-- White document icon -->
  <!-- Document body -->
  <rect x="32" y="22" width="52" height="66" rx="6" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="5"/>
  <!-- Folded corner cut -->
  <polygon points="68,22 84,38 68,38" fill="rgba(255,255,255,0.18)"/>
  <!-- Fold line -->
  <polyline points="68,22 68,38 84,38" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="5" stroke-linejoin="round"/>
  <!-- Document lines -->
  <line x1="44" y1="54" x2="72" y2="54" stroke="rgba(255,255,255,0.85)" stroke-width="5" stroke-linecap="round"/>
  <line x1="44" y1="66" x2="68" y2="66" stroke="rgba(255,255,255,0.65)" stroke-width="5" stroke-linecap="round"/>
  <line x1="44" y1="78" x2="70" y2="78" stroke="rgba(255,255,255,0.65)" stroke-width="5" stroke-linecap="round"/>
  <!-- Sparkle top-right -->
  <g transform="translate(92,30)">
    <path d="M0,-9 L1.8,-1.8 L9,0 L1.8,1.8 L0,9 L-1.8,1.8 L-9,0 L-1.8,-1.8 Z" fill="rgba(255,255,255,0.9)"/>
  </g>
</svg>